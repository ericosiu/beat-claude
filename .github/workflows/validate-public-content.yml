name: Validate public content

on:
  push:
  pull_request:

jobs:
  validate-public-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run public content validator
        run: python scripts/validate_public_content.py
